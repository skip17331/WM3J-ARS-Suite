<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>J-Learn — WM3J ARS Suite</title>
  <link rel="stylesheet" href="jlearn.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="brand-icon">📖</span>
      <span class="brand-name">J-Learn</span>
      <span class="brand-sub">Amateur Radio Reference Library</span>
    </div>
    <div class="topbar-controls">
      <label class="text-size">
        Text size:
        <input type="range" id="jl-text-size" min="80" max="180" step="5" value="100"
               oninput="applyJLearnTextSize(this.value)">
        <span id="jl-text-size-val">100</span>%
      </label>
      <label class="theme-pick" title="Switch between dark and light color themes.">
        Theme:
        <select id="jl-theme" onchange="applyJLearnTheme(this.value)">
          <option value="mocha">Dark</option>
          <option value="latte">Light</option>
        </select>
      </label>
      <button class="btn-ghost" onclick="resetJLearnPrefs()">Reset</button>
      <button class="btn-ghost" onclick="reportJLearnIssue()" title="File a bug on GitHub">🐛 Issue</button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-controls">
        <input type="text" id="jl-search" placeholder="Filter chapters…" oninput="filterLearnToc()">
      </div>
      <div id="jl-toc"></div>
    </aside>

    <main class="viewer" id="jl-viewer">
      <div class="placeholder">
        Pick a chapter on the left to start reading. J-Learn remembers your last-opened
        section automatically. You can also link directly:
        <code>?section=04-03</code>
      </div>
    </main>
  </div>

  <script src="jlearn.js"></script>
</body>
</html>
