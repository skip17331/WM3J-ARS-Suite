<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J-Hub Launcher — Directions</title>
<link rel="stylesheet" href="ars-tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  #root { height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ars-shared.jsx"></script>
<script type="text/babel" src="dir-a.jsx"></script>
<script type="text/babel" src="dir-b.jsx"></script>
<script type="text/babel" src="dir-c.jsx"></script>
<script type="text/babel" src="dir-a-drawer.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const HUES = [
  ['log','J-Log'],['map','J-Map'],['bridge','J-Bridge'],['digi','J-Digi'],
  ['sat','J-Sat'],['vault','J-Vault'],['learn','J-Learn'],
];
const DIRS = [
  { k: 'A', name: 'Command Console', tone: 'Restrained evolution', hue: 'map',
    body: 'Telemetry strip on top → color-coded module grid as the main act → right rail of do-things (setup profiles · activity · connection health). Lowest-risk; a current user recognizes it instantly.' },
  { k: 'B', name: 'Mission Control', tone: 'Expressive instrument panel', hue: 'log',
    body: 'A live radio faceplate is the hero (freq · S-meter · band scope · rotor compass · power/SWR); modules sit below as a grouped dock that glows in its hue when live. Most personality — a glance-able status board you keep open.' },
  { k: 'C', name: 'Flight Deck', tone: 'Software-forward (IDE model)', hue: 'digi',
    body: 'A command bar is the primary verb (⌘K), a persistent left module rail stays open all session, the center holds saved "workspaces" + a session timeline, and an IDE status bar pins telemetry to the bottom. Scales best for a power user.' },
];

function Board({ children }) {
  return (
    <div style={{ width: '100%', height: '100%', borderRadius: 10, overflow: 'hidden', background: '#0d1117', boxShadow: '0 0 0 1px rgba(0,0,0,0.4)' }}>
      {children}
    </div>
  );
}

function Intro({ theme }) {
  return (
    <div className={`ars-root ${theme === 'light' ? 'ars-light' : ''}`} style={{ height: '100%', padding: '26px 30px', borderRadius: 10, overflow: 'hidden' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.15fr', gap: 34, height: '100%' }}>
        <div>
          <div className="ars-eyebrow" style={{ color: 'var(--accent)' }}>ARS Suite · J-Hub</div>
          <div style={{ fontSize: 27, fontWeight: 700, margin: '7px 0 12px', letterSpacing: '-0.4px' }}>The Launcher — three directions</div>
          <div style={{ fontSize: 13.5, lineHeight: 1.6, color: 'var(--t2)', maxWidth: 460 }}>
            Same data & module set in all three — they differ in information architecture, density, and how much instrument-panel personality they carry. Tiles, profiles and workspaces are <b style={{ color: 'var(--t1)' }}>clickable</b>: launch/stop modules, run a setup, switch a workspace. Pick a skeleton; we mix the best parts next.
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 12, marginTop: 20, fontSize: 12, color: 'var(--t2)', lineHeight: 1.5 }}>
            <div style={{ flex: '1 1 46%' }}><b style={{ color: 'var(--t1)' }}>Faithful slate system.</b> Cool-neutral "-jl-" dark palette; light variant via token swap.</div>
            <div style={{ flex: '1 1 46%' }}><b style={{ color: 'var(--t1)' }}>Mono telemetry.</b> JetBrains Mono on every readout — freq, azimuth, SWR, spots, clock.</div>
            <div style={{ flex: '1 1 46%' }}><b style={{ color: 'var(--t1)' }}>JavaFX-safe.</b> No blur/filters — solid fills, borders, simple shadows translate 1:1.</div>
            <div style={{ flex: '1 1 46%' }}><b style={{ color: 'var(--t1)' }}>Custom J- glyphs.</b> A coherent geometric icon per module, not stock icons.</div>
          </div>
          <div style={{ marginTop: 22 }}>
            <div className="ars-eyebrow" style={{ marginBottom: 9 }}>Module hue family</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {HUES.map(([h, n]) => (
                <span key={h} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 12, padding: '5px 10px 5px 8px', borderRadius: 7, background: 'var(--surface-2)', border: '1px solid var(--border)', color: 'var(--t1)' }}>
                  <span style={{ width: 24, height: 24, borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', background: `color-mix(in oklch, var(--${h}) 18%, var(--surface-3))`, color: `var(--${h})`, border: `1px solid color-mix(in oklch, var(--${h}) 28%, transparent)` }}>
                    <ARSGlyph id={h} size={14} stroke={1.9} />
                  </span>{n}
                </span>
              ))}
            </div>
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 11, justifyContent: 'center' }}>
          {DIRS.map(d => (
            <div key={d.k} style={{ display: 'flex', gap: 14, padding: '13px 15px', borderRadius: 9, background: 'var(--surface-1)', border: '1px solid var(--border)', borderLeft: `3px solid var(--${d.hue})` }}>
              <div style={{ fontSize: 22, fontWeight: 700, color: `var(--${d.hue})`, lineHeight: 1, width: 22, flex: '0 0 auto' }}>{d.k}</div>
              <div style={{ minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 9, flexWrap: 'wrap', rowGap: 2 }}>
                  <span style={{ fontSize: 15, fontWeight: 600, whiteSpace: 'nowrap' }}>{d.name}</span>
                  <span style={{ fontSize: 11, color: 'var(--t3)' }}>{d.tone}</span>
                </div>
                <div style={{ fontSize: 12, color: 'var(--t2)', lineHeight: 1.5, marginTop: 6 }}>{d.body}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [theme, setTheme] = useState('dark');
  const W = 1360, H = 884;

  return (
    <React.Fragment>
      <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
        style={{ position: 'fixed', top: 14, right: 16, zIndex: 9999, fontFamily: 'IBM Plex Sans, sans-serif', fontSize: 12.5, fontWeight: 600,
          padding: '8px 14px', borderRadius: 7, cursor: 'pointer', border: '1px solid rgba(0,0,0,0.15)',
          background: theme === 'dark' ? '#161b22' : '#ffffff', color: theme === 'dark' ? '#e8eef4' : '#1a2330',
          boxShadow: '0 2px 10px rgba(0,0,0,0.18)' }}>
        {theme === 'dark' ? '◑ Dark' : '◐ Light'} · toggle theme
      </button>

      <DesignCanvas>
        <DCSection id="overview" title="J-Hub Launcher" subtitle="The front door — top priority. Read the brief panel, then compare the three directions below.">
          <DCArtboard id="intro" label="Brief · shared decisions" width={W} height={372}>
            <Intro theme={theme} />
          </DCArtboard>
        </DCSection>

        <DCSection id="dirs" title="Three directions" subtitle="Same content, different IA & personality. Theme toggle (top-right) affects all three.">
          <DCArtboard id="dirA" label="A · Command Console — strip · grid · do-things rail" width={W} height={H}>
            <Board><ARSDirectionA theme={theme} /></Board>
          </DCArtboard>
          <DCArtboard id="dirB" label="B · Mission Control — faceplate hero · glowing module dock" width={W} height={H}>
            <Board><ARSDirectionB theme={theme} /></Board>
          </DCArtboard>
          <DCArtboard id="dirC" label="C · Flight Deck — command bar · module rail · workspaces" width={W} height={H}>
            <Board><ARSDirectionC theme={theme} /></Board>
          </DCArtboard>
        </DCSection>

        <DCSection id="drawer" title="A → Collapsible module drawer" subtitle="Your idea: A's chiclets become a left menu that hides & reappears. Two triggers, both live — click ☰ to pin it open (pushes content), or push the pointer to the left edge to peek (overlays). Toggle 'Mini rail' vs 'Hidden' (top-right) for how it collapses.">
          <DCArtboard id="dirAD" label="A · Drawer — pin (☰) + edge-hover reveal · mini/hidden collapse" width={W} height={H}>
            <Board><ARSDirectionADrawer theme={theme} /></Board>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
