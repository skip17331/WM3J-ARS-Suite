name: Build

# When this workflow runs:
#   - every push to main
#   - every pull request (useful later if contributors show up)
# Tags (v*) are handled by release.yml, which builds the five ars-fx jars, runs
# the native guard, and publishes the GitHub Release — so they're not built here
# to avoid double work.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      # Don't abort the whole matrix if one OS fails — we want to see both.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # default profile → ars-fx-linux.jar
            fxprofile: ""
          - os: windows-latest     # → ars-fx-windows.jar
            fxprofile: "-Pwin"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin) + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Shared libraries the app embeds — install to the local .m2 first.
      # common before engine (engine depends on common); ars-fx depends on
      # engine + j-digi + j-bridge.
      - name: Build shared libraries
        shell: bash
        run: |
          set -e
          for lib in j-log-common j-log-engine j-digi j-bridge; do
            echo "::group::Installing $lib"
            mvn -B -DskipTests -f "$lib/pom.xml" install
            echo "::endgroup::"
          done

      # Build the unified ars-fx app for this OS (the fxprofile picks the JavaFX
      # native classifier) plus the installer jar.
      - name: Build the ars-fx app + installer
        shell: bash
        run: |
          set -e
          mvn -B -DskipTests ${{ matrix.fxprofile }} -f ars-fx/pom.xml package
          mvn -B -DskipTests -f installer/pom.xml package

      # Collect the app + installer jars into one artifact per OS. Testers can
      # download these from the run page on github.com — no need to build locally.
      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: ars-suite-jars-${{ matrix.os }}
          retention-days: 14
          path: |
            ars-fx/target/ars-fx-*.jar
            !ars-fx/target/ars-fx-[0-9]*.jar
            installer/target/j-installer-*.jar
            !**/original-*.jar
