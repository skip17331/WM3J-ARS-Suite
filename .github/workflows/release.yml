name: Release

# Cut a published GitHub Release when a v* tag is pushed (or run manually via
# the Actions tab for an existing tag). Gates on the full test suite, then runs
# build-release.sh — which builds every per-arch artifact into dist/ and runs
# the host-arch guard — then uploads dist/*.jar to the release.
#
# Replaces the manual `./build-release.sh` + `gh release create` dance and the
# wrong-arch-jar footgun it was prone to. Tag and push to trigger:
#   git tag -a v1.5.2 -m "…" && git push origin v1.5.2
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v1.5.2'
        required: true

permissions:
  contents: write   # required to create/update the GitHub Release

jobs:
  release:
    name: Build + publish release
    runs-on: ubuntu-latest      # x86-64 — required by build-release.sh preflight
    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Set up Java 21 (Temurin) + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Gate the release on green tests. j-log-engine is installed first (its
      # consumers resolve it from the local .m2), then every test-bearing module
      # is exercised. installer has no tests, so it's excluded.
      - name: Run full test suite
        shell: bash
        run: |
          set -e
          mvn -B -q -DskipTests -f j-log-engine/pom.xml install
          for m in j-log-engine j-hub j-log j-map j-digi j-bridge j-sat morse-trainer j-learn j-vault; do
            echo "::group::test $m"
            mvn -B -f "$m/pom.xml" test
            echo "::endgroup::"
          done

      # Builds the 24 artifacts into dist/ (universal + -mac-aarch64 +
      # -linux-aarch64 per JavaFX module, plus the platform-independent jars)
      # and FAILS if the final host-arch guard or the ARM-version preflight trips.
      - name: Build release artifacts (+ arch guard)
        run: ./build-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          TAG="${{ steps.tag.outputs.name }}"
          notes="docs/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then NOTES_ARG=(--notes-file "$notes"); else NOTES_ARG=(--generate-notes); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading/clobbering assets."
            gh release upload "$TAG" dist/*.jar --clobber
          else
            gh release create "$TAG" dist/*.jar \
              --title "WM3J ARS Suite $TAG" --verify-tag "${NOTES_ARG[@]}"
          fi
