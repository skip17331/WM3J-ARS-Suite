name: Release

# Cut a published GitHub Release when a v* tag is pushed (or run manually via
# the Actions tab for an existing tag). Gates on the tests for the ars-fx app +
# its embedded libraries, then runs build-release.sh — which builds the five
# ars-fx jars into dist/ and runs the native-leak guard — then uploads
# dist/*.jar to the release.
#
# Replaces the manual `./build-release.sh` + `gh release create` dance. Tag and
# push to trigger:
#   git tag -a v1.8.0 -m "…" && git push origin v1.8.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v1.8.0'
        required: true

permissions:
  contents: write   # required to create/update the GitHub Release

jobs:
  release:
    name: Build + publish release
    runs-on: ubuntu-latest      # x86-64; JavaFX win/mac/linux classifiers resolve from Maven
    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Set up Java 21 (Temurin) + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Gate the release on green tests for what actually ships: the ars-fx app
      # and the shared libraries it embeds. Install the libs first (consumers
      # resolve them from the local .m2; engine depends on common), then test.
      # ars-fx itself has no tests, so its `test` is a compile/pass.
      - name: Run tests
        shell: bash
        run: |
          set -e
          for lib in j-log-common j-log-engine j-digi j-bridge; do
            mvn -B -q -DskipTests -f "$lib/pom.xml" install
          done
          for m in j-log-common j-log-engine j-digi j-bridge ars-fx; do
            echo "::group::test $m"
            mvn -B -f "$m/pom.xml" test
            echo "::endgroup::"
          done

      # Builds the five ars-fx jars into dist/ (linux-x86_64 / windows-x86_64 /
      # macos-x86_64 / macos-aarch64 / linux-aarch64-pi) and FAILS if the native
      # guard finds a jar carrying a foreign/absent JavaFX native.
      - name: Build release artifacts (+ native guard)
        run: ./build-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          TAG="${{ steps.tag.outputs.name }}"
          notes="docs/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then NOTES_ARG=(--notes-file "$notes"); else NOTES_ARG=(--generate-notes); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading/clobbering assets."
            gh release upload "$TAG" dist/*.jar --clobber
          else
            gh release create "$TAG" dist/*.jar \
              --title "WM3J ARS Suite $TAG" --verify-tag "${NOTES_ARG[@]}"
          fi
