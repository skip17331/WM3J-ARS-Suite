# Copy to .github/workflows/ in the separate Pages repo (finder.py and seeds.txt at its root).
name: hamfest-finder
on:
  schedule: [{cron: "17 5 * * 1"}]     # weekly, Monday 05:17 UTC
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4            # ETags and per-page results, so unchanged pages cost almost nothing
        with: {path: .finder-state.json, key: finder-state-${{ github.run_id }}, restore-keys: finder-state-}
      - run: python3 finder.py --out events.json --state .finder-state.json
      - run: |
          git config user.name "hamfest-finder"; git config user.email "actions@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Update hamfest list" && git push)
